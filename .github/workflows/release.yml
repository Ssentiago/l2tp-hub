name: Release

on:
  push:
    tags: [ "*" ]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release body
        id: body
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n1)
          CHANGELOG=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -n "$PREV_TAG" ]; then
            URL="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            BODY="${CHANGELOG}"$'\n\n'"Full changelog: ${URL}"
          else
            BODY="${CHANGELOG}"
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create draft release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.body.outputs.body }}
          draft: true

  build:
    needs: create-release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            helper
            route-guardian

      - run: bun install

      - name: Build helper (universal)
        run: bun run build:helper

      - name: Build guardian (universal)
        run: bun run build:guardian

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: build-strongswan
          key: native-deps-${{ runner.os }}-${{ hashFiles('build.sh', 'build-strongswan/*.patch') }}

      - name: Build native dependencies (universal)
        run: bun run build:deps

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Release ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false