[package]
name = "l2tp-hub-core"
version = "0.1.0"
edition = "2021"
description = "Core VPN management library — Tauri-independent"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
keyring = "3"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "6"